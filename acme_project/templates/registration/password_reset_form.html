{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <div class="card col-12 col-md-8 col-lg-6">
    <div class="card-header">
      Восстановить пароль
    </div>
    <div class="card-body">
      <p>
        Укажите адрес электронной почты, связанный с учётной записью.
      </p>
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Отправить" %}
      </form>
    </div>
  </div>
{% endblock content %}
