{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <div class="card col-12 col-md-8 col-lg-6">
    <div class="card-header">
      Регистрация пользователя
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Зарегистрироваться" %}
      </form>
    </div>
  </div>
{% endblock content %}
